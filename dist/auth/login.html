<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link rel="stylesheet" href="/public/style/output.css" />
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  </head>
  <body class="bg-gray-100 flex items-center justify-center h-screen">
    <main
      class="flex items-center justify-center bg-white rounded-xl shadow-lg w-240 h-140"
    >
      <!-- Kiri -->
      <div class="flex flex-col items-center justify-center w-1/2">
        <div class="text-center">
          <p class="text-3xl font-bold">Welcome Back</p>
          <p class="text-gray-400">Please sign in to your account.</p>
        </div>

        <div class="gap-2 flex flex-col mt-5">
          <div>
            <p class="font-medium">Email</p>
            <input
              type="email"
              name="email"
              id="email"
              class="block w-90 rounded-sm py-1 px-2 ring-1 ring-inset ring-gray-400 focus:text-gray-500 focus:border-gray-500 focus:ring-1 focus:ring-inset focus:ring-gray-300 mt-1"
            />
          </div>
          <div>
            <p class="font-medium">Password</p>
            <input
              type="password"
              name="password"
              id="password"
              class="block w-90 rounded-sm py-1 px-2 ring-1 ring-inset ring-gray-400 focus:text-gray-500 focus:border-gray-500 focus:ring-1 focus:ring-inset focus:ring-gray-300 mt-1"
            />
          </div>
        </div>

        <button
          onclick="temukan()"
          class="text-white bg-gray-400 rounded-sm w-90 py-1 mt-8"
        >
          Sign In
        </button>
        <div class="flex items-center gap-6 mt-6">
          <hr class="w-24 text-gray-400" />
          <p class="text-sm text-gray-400">Or Continue With</p>
          <hr class="w-24 text-gray-400" />
        </div>

        <div class="flex items-center gap-7 py-2 mt-2">
          <iconify-icon
            icon="ic:baseline-apple"
            width="28"
            height="28"
            class="flex justify-center w-25 h-8 rounded-sm border border-gray-400 text-gray-400"
          ></iconify-icon>
          <iconify-icon
            icon="mdi:google"
            width="23"
            height="23"
            class="flex justify-center w-25 h-8 rounded-sm border border-gray-400 text-gray-400"
          ></iconify-icon>
          <iconify-icon
            icon="ic:baseline-facebook"
            width="24"
            height="24"
            class="flex justify-center w-25 h-8 rounded-sm border border-gray-400 text-gray-400"
          ></iconify-icon>
        </div>

        <p class="text-gray-400 text-sm mt-2 text-center">
          Don't have an account?
          <a class="underline" href="/dist/auth/register.html">Sign Up</a>
        </p>
      </div>

      <!-- Kanan -->
      <div class="w-1/2 rounded-r-xl bg-gray-200 h-full overflow-hidden">
        <img
          src="/public/assets/hero/test1.png"
          alt=""
          class="object-cover w-full h-full"
        />
      </div>

      <script src="/public/script/auth/auth.js"></script>
    </main>
  </body>
</html>

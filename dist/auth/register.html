<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RuangFiksi - Sign Up</title>
    <link rel="stylesheet" href="/dist/style/output.css" />
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  </head>

  <body
    class="min-h-screen bg-[#FCFAF7] flex items-center justify-center font-[Poppins] px-4 py-8"
  >
    <main
      class="w-full max-w-4xl min-h-[500px] bg-white rounded-3xl border border-[#E8E0D7] shadow-[0px_0px_30px_0px_rgba(0,0,0,0.08)] overflow-hidden flex"
    >
      <div class="hidden md:block md:w-1/2 bg-[#F3ECE4] overflow-hidden">
        <img
          src="/public/assets/image/register.png"
          alt="Register illustration"
          class="w-full h-full object-cover object-center"
        />
      </div>

      <div
        class="w-full md:w-1/2 flex flex-col items-center justify-center px-6 sm:px-8 py-8"
      >
        <div class="text-center">
          <p class="text-2xl sm:text-3xl font-bold text-[#3D342B]">
            Create Account
          </p>

          <p class="text-sm text-[#8C7A69] mt-2">
            Buat akun dan jelajahi dunia fiksi.
          </p>
        </div>

        <div class="w-full max-w-[330px] flex flex-col gap-3 mt-7">
          <div>
            <p class="text-sm font-medium text-[#3D342B]">Username</p>

            <input
              type="text"
              name="username"
              placeholder="Enter your username"
              class="block w-full rounded-lg py-2.5 px-3 bg-white border border-[#D9D1C7] outline-none text-[#3D342B] placeholder:text-[#B2A69A] focus:border-[#6B5B4D] focus:ring-2 focus:ring-[#6B5B4D]/15 mt-1.5 transition"
            />
          </div>

          <div>
            <p class="text-sm font-medium text-[#3D342B]">Email</p>

            <input
              type="email"
              name="email"
              placeholder="Enter your email"
              class="block w-full rounded-lg py-2.5 px-3 bg-white border border-[#D9D1C7] outline-none text-[#3D342B] placeholder:text-[#B2A69A] focus:border-[#6B5B4D] focus:ring-2 focus:ring-[#6B5B4D]/15 mt-1.5 transition"
            />
          </div>

          <div>
            <p class="text-sm font-medium text-[#3D342B]">Password</p>

            <input
              type="password"
              name="password"
              placeholder="Enter your password"
              class="block w-full rounded-lg py-2.5 px-3 bg-white border border-[#D9D1C7] outline-none text-[#3D342B] placeholder:text-[#B2A69A] focus:border-[#6B5B4D] focus:ring-2 focus:ring-[#6B5B4D]/15 mt-1.5 transition"
            />
          </div>
        </div>

        <a
          href="/dist/auth/login.html"
          class="w-full max-w-[330px] text-white font-semibold rounded-lg py-2.5 mt-7 bg-[#6B5B4D] hover:bg-[#5A4B3E] active:scale-[0.99] transition text-center"
        >
          Sign Up
        </a>

        <div class="w-full max-w-[330px] flex items-center gap-3 mt-6">
          <hr class="flex-1 border-[#E8E0D7]" />

          <p class="text-xs text-[#8C7A69] whitespace-nowrap">
            Or Continue With
          </p>

          <hr class="flex-1 border-[#E8E0D7]" />
        </div>

        <div class="w-full max-w-[330px] grid grid-cols-3 gap-3 mt-4">
          <button
            class="h-10 rounded-lg border border-[#D9D1C7] text-[#6B5B4D] bg-white hover:bg-[#FAF7F2] transition flex items-center justify-center"
          >
            <iconify-icon
              icon="ic:baseline-apple"
              width="24"
              height="24"
            ></iconify-icon>
          </button>

          <button
            class="h-10 rounded-lg border border-[#D9D1C7] text-[#6B5B4D] bg-white hover:bg-[#FAF7F2] transition flex items-center justify-center"
          >
            <iconify-icon
              icon="mdi:google"
              width="22"
              height="22"
            ></iconify-icon>
          </button>

          <button
            class="h-10 rounded-lg border border-[#D9D1C7] text-[#6B5B4D] bg-white hover:bg-[#FAF7F2] transition flex items-center justify-center"
          >
            <iconify-icon
              icon="ic:baseline-facebook"
              width="23"
              height="23"
            ></iconify-icon>
          </button>
        </div>

        <p class="text-[#8C7A69] text-sm mt-5 text-center">
          Already have an account?

          <a
            class="font-semibold text-[#6B5B4D] underline underline-offset-4 hover:text-[#3D342B]"
            href="/dist/auth/login.html"
          >
            Sign In
          </a>
        </p>
      </div>
    </main>
  </body>
</html>

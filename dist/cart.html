<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruang Fiksi - Shopping Cart</title>
    <link rel="stylesheet" href="/dist/style/output.css" />
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  </head>

  <body class="font-[Poppins] min-h-screen flex flex-col bg-[#FCFAF7]">
    <div id="navbar"></div>

    <main class="pt-45 px-6 md:px-16 lg:px-42 flex-1">
      <div
        class="grid grid-cols-1 lg:grid-cols-[1.7fr_1fr] gap-8 lg:gap-10 items-start"
      >
        <!-- LEFT -->
        <div>
          <p class="text-3xl md:text-4xl font-bold text-[#3D342B] mb-4">
            Keranjang
          </p>

          <button
            onclick="hapusSemua()"
            class="flex items-center gap-2 text-red-500 mb-6 text-sm md:text-base"
          >
            <iconify-icon icon="ph:trash" width="20"></iconify-icon>
            Hapus Semua
          </button>

          <div id="cartContainer" class="flex flex-col gap-4"></div>
        </div>

        <!-- RIGHT -->
        <div class="lg:sticky lg:top-45 lg:pt-[94px]">
          <div
            class="bg-white border border-[#E8E0D7] rounded-2xl p-5 md:p-6 shadow-[0px_0px_30px_0px_rgba(0,0,0,0.08)]"
          >
            <p
              class="text-xl md:text-2xl font-bold mb-6 md:mb-8 text-[#3D342B]"
            >
              Order Summary
            </p>

            <div
              class="flex justify-between mb-4 text-[#6B5B4D] text-sm md:text-base"
            >
              <p>Subtotal</p>
              <p id="subtotal">Rp0</p>
            </div>

            <div
              class="flex justify-between mb-4 text-[#6B5B4D] text-sm md:text-base"
            >
              <p>Shipping</p>
              <p>Gratis</p>
            </div>

            <div
              class="border-t border-[#E8E0D7] pt-5 flex justify-between font-bold text-lg md:text-xl text-[#3D342B]"
            >
              <p>Total</p>
              <p id="total">Rp0</p>
            </div>

            <button
              onclick="checkout()"
              class="bg-[#6B5B4D] hover:bg-[#5A4B3E] text-white w-full py-3 rounded-xl mt-8 transition"
            >
              Checkout
            </button>
          </div>
        </div>
      </div>
    </main>

    <div id="footer" class="mt-16 lg:mt-20"></div>

    <script src="/public/script/cart.js"></script>

    <script>
      fetch("/public/components/navbar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar").innerHTML = data;

          const script = document.createElement("script");
          script.src = "/public/script/navbar.js";
          document.body.appendChild(script);
        });

      fetch("/public/components/footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data;
        });
    </script>
  </body>
</html>

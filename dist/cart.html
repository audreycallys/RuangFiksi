<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="/public/style/output.css" />
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  </head>
  <body>
    <div id="navbar"></div>

    <main class="pt-45 px-42 mb-5">
      <div class="flex gap-10 items-start">
        <!-- LEFT -->
        <div class="w-[70%]">
          <p class="text-4xl font-bold mb-10">Keranjang</p>

          <div class="flex items-center justify-between mb-8 text-lg font-medium">
            <label class="flex items-center gap-3">
              <input type="checkbox" class="w-4 h-4"/>
              Semua
            </label>

            <button class="flex items-center gap-2 text-red-500">
              <iconify-icon icon="ph:trash" width="20"></iconify-icon>
              Hapus Semua
            </button>
          </div>

          <div id="cartContainer" class="flex flex-col gap-5"></div>
        </div>

        <!-- RIGHT -->
        <div class="w-[45%] sticky top-55">
          <div class="border border-gray-300 rounded-2xl p-6">
            <p class="text-2xl font-bold mb-8">Order Summary</p>

            <div class="flex justify-between mb-4">
              <p>Subtotal</p>
              <p id="subtotal">Rp0</p>
            </div>

            <div class="flex justify-between mb-4">
              <p>Shipping</p>
              <p>Gratis</p>
            </div>

            <div
              class="border-t border-gray-300 pt-5 flex justify-between font-bold text-xl"
            >
              <p>Total</p>
              <p id="total">Rp0</p>
            </div>

            <button
              onclick="checkout()"
              class="bg-sky-950 text-white w-full py-3 rounded-xl mt-8"
            >
              Checkout
            </button>
          </div>
        </div>
      </div>
    </main>
    s

    <div id="footer"></div>

    <script src="/public/script/cart.js"></script>

    <script>
      fetch("/public/components/navbar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar").innerHTML = data;

          const script = document.createElement("script");
          script.src = "/public/script/navbar.js";
          document.body.appendChild(script);
        });

      fetch("/public/components/footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data;
        });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalog</title>
    <link rel="stylesheet" href="/public/style/output.css" />
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  </head>
  <body class="font-[Poppins]">
    <div id="navbar"></div>

    <main class="pt-45 mb-15 px-42">
      <div class="flex gap-15">
        <!-- SIDEBAR -->
        <aside class="w-55">
          <div
            class="flex items-center justify-between border-b border-gray-300 pb-3"
          >
            <p class="font-bold text-xl">Categories</p>
          </div>

          <div class="mt-5">
            <button
              onclick="tampilkanBuku(books)"
              class="font-semibold mb-3 hover:text-sky-900 cursor-pointer"
            >
              Books
            </button>

            <ul class="space-y-1 text-sm">
              <li>
                <button
                  onclick="filterKategori('Romansa')"
                  class="cursor-pointer hover:text-sky-900"
                >
                  Romansa
                </button>
              </li>
              <li>
                <button
                  onclick="filterKategori('Drama')"
                  class="cursor-pointer hover:text-sky-900"
                >
                  Drama
                </button>
              </li>
              <li>
                <button
                  onclick="filterKategori('Fantasi')"
                  class="cursor-pointer hover:text-sky-900"
                >
                  Fantasi
                </button>
              </li>
              <li>
                <button
                  onclick="filterKategori('Sejarah')"
                  class="cursor-pointer hover:text-sky-900"
                >
                  Sejarah
                </button>
              </li>
              <li>
                <button
                  onclick="filterKategori('Sastra')"
                  class="cursor-pointer hover:text-sky-900"
                >
                  Sastra
                </button>
              </li>
              <li>
                <button
                  onclick="filterKategori('Misteri')"
                  class="cursor-pointer hover:text-sky-900"
                >
                  Misteri
                </button>
              </li>
            </ul>
          </div>

          <div class="border-t border-gray-300 mt-5 pt-5">
            <p class="font-semibold mb-3">Best Seller</p>

            <ul class="space-y-1 text-sm">
              <li>
                <button
                  onclick="filterTopRated()"
                  class="cursor-pointer hover:text-sky-900"
                >
                  Rating tertinggi
                </button>
              </li>
              <li>
                <button
                  onclick="filterMostSold()"
                  class="cursor-pointer hover:text-sky-900"
                >
                  Banyak terjual
                </button>
              </li>
            </ul>
          </div>

          <div class="border-t border-gray-300 mt-5 pt-5">
            <p class="font-semibold mb-3">Bargain Books</p>

            <ul class="space-y-1 text-sm">
              <li>
                <button
                  onclick="filterHarga(50000, 100000)"
                  class="cursor-pointer hover:text-sky-900"
                >
                  Rp50.000 - Rp100.000
                </button>
              </li>
              <li>
                <button
                  onclick="filterHarga(100000, Infinity)"
                  class="cursor-pointer hover:text-sky-900"
                >
                  Above Rp100.000
                </button>
              </li>
            </ul>
          </div>
        </aside>

        <!-- PRODUCT LIST -->
        <section class="flex-1">
          <h1 class="text-3xl font-bold mb-8">Books</h1>

          <div
            id="productList"
            class="grid grid-cols-5 gap-x-10 gap-y-16"
          ></div>
        </section>
      </div>
    </main>

    <div id="footer" class="mt-20"></div>

    <script src="/public/script/catalog.js"></script>

    <script>
      fetch("/public/components/navbar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar").innerHTML = data;

          const script = document.createElement("script");
          script.src = "/public/script/navbar.js";
          document.body.appendChild(script);
        });

      fetch("/public/components/footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data;
        });
    </script>
  </body>
</html>

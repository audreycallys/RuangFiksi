<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Product</title>
    <link rel="stylesheet" href="/public/style/output.css" />
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  </head>
  <body class="bg-white font-[Poppins]">
    <div id="navbar"></div>

    <main class="pt-45 px-42">
      <section id="detailBuku"></section>
    </main>

    <main class="mt-5 px-42">
      <div class="flex justify-between p-5 items-center">
        <p class="text-3xl font-bold">Produk Terkait</p>
      </div>

      <div
        class="bg-gray-100 w-full h-90 rounded-2xl flex shadow-[0px_0px_5px_rgba(0,0,0,0.1)]"
      >
        <div
          id="bukuTerkait"
          class="grid grid-cols-6 justify-center items-center gap-8 px-8"
        ></div>
      </div>
    </main>

    <div id="footer" class="mt-20"></div>

    <script src="/public/script/detail.js"></script>

    <script>
      fetch("/public/components/navbar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar").innerHTML = data;

          const script = document.createElement("script");
          script.src = "/public/script/navbar.js";
          document.body.appendChild(script);
        });

      fetch("/public/components/footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data;
        });
    </script>
  </body>
</html>

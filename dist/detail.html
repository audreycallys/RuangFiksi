<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Product</title>
    <link rel="stylesheet" href="/public/style/output.css" />
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  </head>
  <body class="bg-white">
    <div id="navbar"></div>

    <main class="pt-36 px-35">
      <section id="detailBuku"></section>

      <section class="mt-16 bg-gray-100 px-10 py-10">
        <h2 class="text-3xl font-semibold mb-8">Produk Terkait</h2>
        <div id="bukuTerkait" class="grid grid-cols-5 gap-8"></div>
      </section>
    </main>

    <div id="footer"></div>

    <script src="/public/script/detail.js"></script>

    <script>
      fetch("/public/components/navbar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar").innerHTML = data;

          const script = document.createElement("script");
          script.src = "/public/script/navbar.js";
          document.body.appendChild(script);
        });

      fetch("/public/components/footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data;
        });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RuangFiksi - Detail Product</title>
    <link rel="stylesheet" href="/dist/style/output.css" />
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  </head>

  <body class="bg-[#FCFAF7] font-[Poppins]">
    <div id="navbar"></div>

    <main class="pt-45 px-6 md:px-16 lg:px-42">
      <section id="detailBuku"></section>
    </main>

    <main class="mt-10 px-6 md:px-16 lg:px-42">
      <div class="flex justify-between py-5 items-center">
        <p class="text-2xl md:text-3xl font-bold text-[#3D342B]">
          Produk Terkait
        </p>
      </div>

      <div
        class="bg-[#FAF7F2] border border-[#E8E0D7] w-full rounded-2xl shadow-[0px_0px_10px_rgba(0,0,0,0.05)] overflow-hidden"
      >
        <div
          id="bukuTerkait"
          class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-5 md:gap-8 p-5 md:p-8"
        ></div>
      </div>
    </main>

    <div id="footer" class="mt-16 lg:mt-20"></div>

    <script src="/public/script/detail.js"></script>

    <script>
      fetch("/public/components/navbar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar").innerHTML = data;

          const script = document.createElement("script");
          script.src = "/public/script/navbar.js";
          document.body.appendChild(script);
        });

      fetch("/public/components/footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data;
        });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RuangFiksi - Profile</title>
    <link rel="stylesheet" href="/dist/style/output.css" />
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  </head>

  <body class="font-[Poppins] min-h-screen flex flex-col bg-[#FCFAF7]">
    <div id="navbar"></div>

    <main class="pt-45 mb-15 px-6 md:px-16 lg:px-42 flex-1">
      <div class="flex flex-col lg:flex-row gap-8 items-stretch">
        <!-- SIDEBAR -->
        <aside
          class="w-full lg:w-60 bg-white border border-[#E8E0D7] rounded-2xl p-6 shadow-[0px_0px_20px_rgba(0,0,0,0.04)] lg:self-stretch"
        >
          <div
            class="flex flex-row lg:flex-col items-center gap-4 lg:gap-0 border-b border-[#D9D1C7] pb-6"
          >
            <img
              id="sidebarImage"
              src=""
              class="w-16 h-16 lg:w-20 lg:h-20 rounded-full object-cover bg-[#E8E0D7]"
            />
            <div class="lg:text-center lg:mt-4">
              <p id="sidebarNama" class="font-bold text-[#3D342B]">Nama User</p>
              <p id="sidebarEmail" class="text-sm text-[#8C7A69] mt-1">
                email@gmail.com
              </p>
            </div>
          </div>

          <div class="mt-6 flex flex-row lg:flex-col gap-4 lg:gap-0">
            <a
              href="/dist/profile.html?page=akun"
              class="font-semibold text-[#6B5B4D] hover:text-[#3D342B] transition lg:mb-4"
              >Akun</a
            >
            <a
              href="/dist/profile.html?page=wishlist"
              class="font-semibold text-[#6B5B4D] hover:text-[#3D342B] transition"
              >Wishlist</a
            >
          </div>
        </aside>

        <!-- CONTENT -->
        <section
          class="flex-1 bg-white border border-[#E8E0D7] rounded-2xl p-6 md:p-10 lg:p-16 shadow-[0px_0px_20px_rgba(0,0,0,0.04)]"
        >
          <div id="profileContent"></div>
        </section>
      </div>
    </main>

    <div id="footer" class="mt-5"></div>

    <script src="/public/script/profile.js"></script>

    <script>
      fetch("/public/components/navbar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar").innerHTML = data;
          const script = document.createElement("script");
          script.src = "/public/script/navbar.js";
          document.body.appendChild(script);
        });

      fetch("/public/components/footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data;
        });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Footer</title>
    <link rel="stylesheet" href="/public/style/output.css" />
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  </head>
  <body>
    <footer class="mt-24 bg-[#F8F8F8]">
      <!-- TOP -->
      <div class="grid grid-cols-3 gap-24 px-30 py-16">
        <!-- FOLLOW -->
        <div>
          <h3 class="font-bold tracking-[0.2em] text-sm mb-7">FOLLOW US</h3>

          <div class="flex gap-4 mb-10">
            <div
              class="w-11 h-11 rounded-full bg-white shadow-sm flex items-center justify-center hover:bg-black hover:text-white transition duration-300 cursor-pointer"
            >
              <iconify-icon icon="mdi:facebook" class="text-2xl"></iconify-icon>
            </div>

            <div
              class="w-11 h-11 rounded-full bg-white shadow-sm flex items-center justify-center hover:bg-black hover:text-white transition duration-300 cursor-pointer"
            >
              <iconify-icon
                icon="mdi:instagram"
                class="text-2xl"
              ></iconify-icon>
            </div>

            <div
              class="w-11 h-11 rounded-full bg-white shadow-sm flex items-center justify-center hover:bg-black hover:text-white transition duration-300 cursor-pointer"
            >
              <iconify-icon
                icon="ic:baseline-tiktok"
                class="text-2xl"
              ></iconify-icon>
            </div>

            <div
              class="w-11 h-11 rounded-full bg-white shadow-sm flex items-center justify-center hover:bg-black hover:text-white transition duration-300 cursor-pointer"
            >
              <iconify-icon icon="mdi:youtube" class="text-2xl"></iconify-icon>
            </div>
          </div>

          <h3 class="font-bold tracking-[0.2em] text-sm mb-5">DOWNLOAD APP</h3>

          <div class="flex gap-3">
            <button
              class="bg-black text-white px-5 py-3 rounded-lg text-sm hover:opacity-80 transition"
            >
              Google Play
            </button>

            <button
              class="bg-black text-white px-5 py-3 rounded-lg text-sm hover:opacity-80 transition"
            >
              App Store
            </button>
          </div>
        </div>

        <!-- MENU -->
        <div>
          <h3 class="font-bold tracking-[0.2em] text-sm mb-7">MENU</h3>

          <ul class="space-y-4 text-gray-600">
            <li>
              <a href="#" class="hover:text-black transition"> Home </a>
            </li>

            <li>
              <a href="#" class="hover:text-black transition"> Product </a>
            </li>

            <li>
              <a href="#" class="hover:text-black transition"> About </a>
            </li>

            <li>
              <a href="#" class="hover:text-black transition"> Cart </a>
            </li>
          </ul>
        </div>

        <!-- ABOUT -->
        <div>
          <div class="flex items-center gap-3 mb-6">
            <img
              src="/public/assets/sakezza.png"
              alt=""
              class="w-12 h-12 object-contain"
            />

            <p class="text-3xl font-bold tracking-wide">KEZZA</p>
          </div>

          <p class="text-gray-600 leading-8 max-w-md">
            Explore fashion, jewelry, and lifestyle products curated to bring
            modern style, comfort, and simplicity into your everyday life.
          </p>
        </div>
      </div>

      <!-- BOTTOM -->
      <div
        class="bg-[#1E1E1E] text-white px-30 py-8 flex items-center justify-between"
      >
        <div class="flex items-center gap-3">
          <img src="/public/assets/sakezza.png" alt="" class="w-9" />

          <p class="tracking-[0.3em] text-lg font-medium">KEZZA</p>
        </div>

        <p class="text-sm text-gray-300">© 2026 KEZZA. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
